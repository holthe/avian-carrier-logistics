<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>Avian Carrier Logistics, 16px</title>
  <!-- Pixel-grid reduction of favicon.svg for the smallest .ico entry.
       Three ascending steps stand in for the angled wing bars; diagonals
       do not survive 16px. -->
  <rect width="16" height="16" fill="#0f2a4a"/>
  <g fill="#f26522">
    <rect x="1" y="11" width="7" height="3"/>
    <rect x="5" y="7" width="7" height="3" opacity="0.85"/>
    <rect x="9" y="3" width="6" height="3" opacity="0.7"/>
  </g>
</svg>
